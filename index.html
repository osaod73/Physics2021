<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<meta name="theme-color" content="#3F51B5"><title>المحترف في الفيزياء</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1f3a;--pr:#3F51B5;--ok:#2e9e5b;--no:#d64545;--bd:#d9dcef}
@media(prefers-color-scheme:dark){:root{--bg:#14162b;--card:#1f2240;--tx:#eceefc;--pr:#7d8cff;--bd:#383c66}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:auto;padding:12px}
h1{font-size:1.3rem;margin:.5rem 0;text-align:center}h2{font-size:1.05rem;margin:.6rem 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
button{font:inherit;color:inherit;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:12px;width:100%;margin:5px 0;cursor:pointer;text-align:start}
button.p{background:var(--pr);color:#fff;border:0;text-align:center;font-weight:700}
.row{display:flex;gap:8px}.row>*{flex:1}
.q img,.opt img,.sol img{max-width:100%;height:auto;background:#fff;border-radius:8px;display:block;margin:auto}
.opt{display:flex;align-items:center;gap:10px;direction:ltr}.opt b{min-width:1.6em}
.opt.ok{border:2px solid var(--ok);background:rgba(46,158,91,.15)}.opt.no{border:2px solid var(--no);background:rgba(214,69,69,.15)}
.st{display:flex;justify-content:space-between;font-size:.85rem;opacity:.85}
.big{font-size:2.2rem;text-align:center;font-weight:800;color:var(--pr)}
.sub{padding-inline-start:12px;display:none}.open .sub{display:block}.open .unit .ch{transform:rotate(180deg)}
h2{border-inline-start:5px solid var(--pr);padding-inline-start:8px}
.sem{color:#fff;border:0;text-align:center;font-weight:700;padding:16px;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.s1{background:linear-gradient(135deg,#3F51B5,#6573d6)}.s2{background:linear-gradient(135deg,#00897B,#2fb5a5)}.s3{background:linear-gradient(135deg,#6A1B9A,#a24bc9)}
.unit{display:flex;align-items:center;gap:10px;background:hsl(var(--h) 55% 42%);color:#fff;border:0;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.unit .n{background:rgba(255,255,255,.25);width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;flex:none}
.unit .ch{margin-inline-start:auto;transition:transform .2s}
.les{background:hsl(var(--h) 70% 94%);color:#1b1f3a;border:1px solid hsl(var(--h) 45% 80%);border-inline-start:5px solid hsl(var(--h) 55% 42%);font-size:.92rem;border-radius:10px}
.les.all{font-weight:700;background:hsl(var(--h) 70% 88%)}
@media(prefers-color-scheme:dark){.les{background:hsl(var(--h) 30% 20%);color:var(--tx);border-color:hsl(var(--h) 30% 32%)}.les.all{background:hsl(var(--h) 32% 27%)}}

.cover{position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;min-height:calc(100vh - 24px);min-height:calc(100dvh - 24px);background:radial-gradient(circle at 85% 8%,#7c4dff 0,transparent 45%),radial-gradient(circle at 10% 95%,#00bfa5 0,transparent 40%),linear-gradient(160deg,#1a237e,#3F51B5);box-shadow:0 10px 30px rgba(26,35,126,.35)}
.cover>*{position:relative;z-index:1}.cover .sy{position:absolute;inset:0;z-index:0;pointer-events:none}
.sy span{position:absolute;color:rgba(255,255,255,.16);font-family:Georgia,serif;font-weight:700;animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-16px) rotate(8deg)}}
.cover .top{text-align:center}.bd{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 14px;border-radius:99px;font-size:.82rem;backdrop-filter:blur(6px)}
.cover .mid{text-align:center}.logo{width:92px;height:92px;margin:0 auto 14px;border-radius:26px;display:grid;place-items:center;font:700 3.4rem Georgia,serif;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 24px rgba(0,0,0,.25);backdrop-filter:blur(8px)}
.cover h1{font-size:1.9rem;margin:.2rem 0 .5rem;line-height:1.3}.cover p{margin:0 auto 18px;max-width:30ch;opacity:.9;line-height:1.7}
.stats{display:flex;gap:8px;margin-bottom:14px}.stats div{flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:10px 4px;font-size:.8rem;backdrop-filter:blur(6px)}.stats b{display:block;font-size:1.4rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chips span{font-size:.78rem;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.cover .bot{text-align:center}.go{background:#fff;color:#283593;border:0;text-align:center;font-weight:800;font-size:1.1rem;padding:15px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .15s}.go:active{transform:scale(.97)}
.cover small{display:block;margin-top:10px;opacity:.75;font-size:.75rem}
@media(prefers-reduced-motion:reduce){.sy span{animation:none}}
</style></head><body><div id="app"></div>
<script>
let D,U,M;
const $=s=>document.getElementById(s),A=$("app"),im=n=>!M[n]?"":`<img src="assets/img${M[n]}/${n}.jpg" alt="" onerror="this.style.display='none'">`;
let S={},opn=-1;
function home(){let h=`<h1>المحترف في الفيزياء</h1><div class="card" style="text-align:center">الفيزياء 12 – الفرع العلمي والصناعي<br><small>${D.length} سؤال</small></div>
<h2>اختبارات شاملة</h2><div class="row"><button class="sem s1" onclick="go([1,2])">الفصل الأول</button><button class="sem s2" onclick="go([3])">الفصل الثاني</button></div><button class="sem s3" onclick="go([1,2,3])">الفصلان</button><h2>حسب الوحدة والدرس</h2>`;
U.forEach((u,i)=>{h+=`<div class="${opn==i?'open':''}" style="--h:${[230,170,28,280][i%4]}"><button class="unit" onclick="opn=opn==${i}?-1:${i};home()"><span class="n">${u.n}</span><span>الوحدة ${u.n}: ${u.name}</span><span class="ch">▾</span></button><div class="sub"><button class="les all" onclick="go([${u.n}])">كل دروس الوحدة</button>`+u.lessons.map(l=>`<button class="les" onclick="go([${u.n}],${l[0]})">الدرس ${l[0]}: ${l[1]}</button>`).join("")+`</div></div>`});A.innerHTML=h}
function go(c,l){let p=D.filter(r=>c.includes(r.c)&&(!l||r.l==l));p.sort(()=>Math.random()-.5);S={q:p.slice(0,10),i:0,a:[]};quiz()}
function quiz(){const r=S.q[S.i];if(!r)return res();const a=S.a[S.i];
let h=`<div class="st"><span>السؤال ${S.i+1} / ${S.q.length}</span><span>صحيح: ${S.a.filter((x,i)=>x==S.q[i].t).length}</span>${/^\d{4}$/.test(r.y)?`<span>${r.y}</span>`:""}</div><div class="card q">${im(r.q)}</div>`;
r.o.forEach((n,k)=>{const c=a==null||a==0?"":(k+1==r.t?"ok":(k+1==a?"no":""));h+=`<button class="opt ${c}" ${a==null?`onclick="pick(${k+1})"`:""}><b>${"ABCD"[k]}</b>${im(n)}</button>`});
h+=`<div class="row"><button onclick="sol()">الحل</button>${a==null?`<button onclick="pick(0)">تجاوز</button>`:""}<button class="p" onclick="S.i++;quiz()">${S.i==S.q.length-1?"النتيجة":"التالي"}</button></div><div id="sol"></div><button onclick="if(confirm('العودة إلى الرئيسية؟'))home()">الرئيسية</button>`;A.innerHTML=h;scrollTo(0,0)}
function pick(k){S.a[S.i]=k;quiz()}
function sol(){$("sol").innerHTML=`<div class="card sol">${im(S.q[S.i].s)}</div>`}
function res(){const n=S.q.length,ok=S.q.filter((r,i)=>S.a[i]==r.t).length,sk=S.q.filter((r,i)=>!S.a[i]).length,pc=Math.round(ok/n*100);
A.innerHTML=`<h1>النتيجة</h1><div class="card"><div class="big">${pc}%</div><p style="text-align:center">${pc>=50?"ألف مبارك.. نجحت في الاختبار":"للأسف لم تنجح في الاختبار"}</p>
<div class="st"><span>عدد الأسئلة</span><b>${n}</b></div><div class="st"><span>الإجابات الصحيحة</span><b>${ok}</b></div><div class="st"><span>الإجابات الخاطئة</span><b>${n-ok-sk}</b></div><div class="st"><span>المتجاوز عنها</span><b>${sk}</b></div></div>
<button class="p" onclick="rev()">مراجعة الإجابات</button><button onclick="home()">الرئيسية</button>`}
function rev(){A.innerHTML=`<h1>المراجعة</h1>`+S.q.map((r,i)=>`<div class="card q"><b>${i+1}) ${S.a[i]==r.t?"✅ صحيحة":S.a[i]?"❌ خاطئة":"⏭ متجاوزة"}</b>${im(r.q)}<p>الإجابة الصحيحة: <b>${"ABCD"[r.t-1]}</b>${S.a[i]?` – إجابتك: ${"ABCD"[S.a[i]-1]}`:""}</p><div class="sol">${im(r.s)}</div></div>`).join("")+`<button class="p" onclick="home()">الرئيسية</button>`}
let VER='';fetch('sw.js',{cache:'no-store'}).then(r=>r.text()).then(s=>{VER=(/VERSION\s*=\s*'([^']+)'/.exec(s)||[])[1]||'';const e=$('ver');if(e&&VER)e.textContent='الإصدار '+VER}).catch(()=>{});
function cover(){const P=[[6,8,2.6],[14,70,1.8],[40,6,2.2],[62,80,2.4],[78,12,1.6],[88,60,2.8],[28,88,1.8],[52,4,1.5]];
A.innerHTML=`<div class="cover"><div class="sy">${["F=ma","λ","Ω","ΔV","B","θ","∮","E=mc²"].map((s,i)=>`<span style="top:${P[i][0]}%;${i%2?"left":"right"}:${P[i][1]}%;font-size:${P[i][2]}rem;animation-delay:${i*.7}s">${s}</span>`).join("")}</div>
<div class="top"><span class="bd">الفيزياء · الصف الثاني عشر</span></div>
<div class="mid"><div class="logo">φ</div><h1>المحترف في الفيزياء</h1><p>تدرّب على أسئلة متنوعة في كل وحدات المنهاج، مع حل مصوّر لكل سؤال</p>
<div class="stats"><div><b>${D.length}</b>سؤال</div><div><b>${U.length}</b>وحدات</div><div><b>2</b>فصلان</div></div>
<div class="chips"><span>حل تفصيلي</span><span>اختبارات من 10 أسئلة</span><span>مراجعة الإجابات</span></div></div>
<div class="bot"><button class="go" onclick="home()">ابدأ التدريب ←</button><small>يعمل على جميع الهواتف دون تثبيت</small><small id="ver" style="margin-top:3px">${VER?"الإصدار "+VER:""}</small></div></div>`;scrollTo(0,0)}
fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{D=j.questions;U=j.units;M=j.map;cover()}).catch(()=>{A.innerHTML='<div class="card">تعذّر تحميل data.json. شغّل الصفحة عبر استضافة أو خادم وليس بفتح الملف مباشرة.</div>'})

if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;
addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(g=>g.update()).catch(()=>{}));
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had)return;const d=document.createElement('div');
d.style.cssText='position:fixed;inset:auto 12px 12px;z-index:99;background:#1a237e;color:#fff;padding:12px;border-radius:12px;text-align:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)';
d.textContent='تم تحديث التطبيق — اضغط هنا لإعادة التحميل';d.onclick=()=>location.reload();document.body.appendChild(d)})}
</script></body></html>
